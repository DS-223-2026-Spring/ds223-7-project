site_name: Pulse — Free-to-Paid Conversion Platform
site_description: DS-223 Marketing Analytics · Group 7 · Spring 2026
site_url: https://ds-223-2026-spring.github.io/ds223-7-project/
repo_url: https://github.com/DS-223-2026-Spring/ds223-7-project
repo_name: DS-223-2026-Spring/ds223-7-project
docs_dir: docs/pages

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: teal
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: teal
      accent: lime

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]

nav:
  - Home: index.md
  - Overview:
      - Problem & Solution: overview/problem.md
      - Architecture: overview/architecture.md
      - Roadmap: overview/roadmap.md
      - KPIs: overview/kpis.md
  - Database: database/index.md
  - ETL Pipeline: etl/index.md
  - Model Engine: model/index.md
  - API: api/index.md
  - Dashboard: dashboard/index.md
  - About: about/team.md
