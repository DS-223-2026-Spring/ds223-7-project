site_name: Pulse — Free-to-Paid Conversion Platform
site_description: DS-223 Marketing Analytics · Group 7 · Spring 2026
site_url: https://ds-223-2026-spring.github.io/ds223-7-project/
repo_url: https://github.com/DS-223-2026-Spring/ds223-7-project
repo_name: DS-223-2026-Spring/ds223-7-project
docs_dir: docs/pages

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview:
      - Problem & Solution: overview/problem.md
      - Architecture: overview/architecture.md
      - Roadmap: overview/roadmap.md
      - KPIs: overview/kpis.md
  - Database: database/index.md
  - ETL Pipeline: etl/index.md
  - Model Engine: model/index.md
  - API: api/index.md
  - Dashboard: dashboard/index.md
  - About: about/team.md
